
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-maven-app
  namespace: fargate
  labels:
    app: java-maven-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-maven-app
  template:
    metadata:
      labels:
        app: java-maven-app
    spec:
      containers:
        - name: java-maven-app
          image: ${DOCKER_REPO}:${IMAGE_NAME}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080